<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="owlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Subtle starry sparkles -->
  <circle cx="96" cy="112" r="8" fill="#FDE68A" opacity="0.85" />
  <circle cx="424" cy="126" r="10" fill="#FDE68A" opacity="0.9" />
  <circle cx="110" cy="396" r="6" fill="#C7D2FE" opacity="0.8" />
  <circle cx="410" cy="382" r="8" fill="#C7D2FE" opacity="0.8" />

  <!-- Top golden star crest -->
  <path d="M256 62 L272 98 L312 103 L282 130 L290 169 L256 150 L222 169 L230 130 L200 103 L240 98 Z" fill="url(#goldGrad)" stroke="#FFFBEB" stroke-width="4" stroke-linejoin="round" />

  <!-- Owl ears -->
  <path d="M158 192 L138 142 L198 168 Z" fill="#4338CA" />
  <path d="M354 192 L374 142 L314 168 Z" fill="#4338CA" />

  <!-- Owl body -->
  <ellipse cx="256" cy="296" rx="132" ry="126" fill="url(#owlGrad)" stroke="#C7D2FE" stroke-width="6" />

  <!-- Owl belly -->
  <ellipse cx="256" cy="326" rx="84" ry="78" fill="#FFFBEB" />

  <!-- Owl wings -->
  <ellipse cx="122" cy="304" rx="28" ry="64" transform="rotate(-14 122 304)" fill="#4338CA" />
  <ellipse cx="390" cy="304" rx="28" ry="64" transform="rotate(14 390 304)" fill="#4338CA" />

  <!-- Eyes outer -->
  <circle cx="206" cy="240" r="46" fill="#FFFFFF" />
  <circle cx="306" cy="240" r="46" fill="#FFFFFF" />

  <!-- Pupils -->
  <circle cx="212" cy="242" r="21" fill="#1E1B4B" />
  <circle cx="300" cy="242" r="21" fill="#1E1B4B" />
  <circle cx="220" cy="232" r="7" fill="#FFFFFF" />
  <circle cx="308" cy="232" r="7" fill="#FFFFFF" />

  <!-- Glasses frames -->
  <circle cx="206" cy="240" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="9" />
  <circle cx="306" cy="240" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="9" />
  <line x1="252" y1="240" x2="260" y2="240" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Beak -->
  <path d="M236 268 L276 268 L256 300 Z" fill="#F59E0B" stroke="#D97706" stroke-width="3" stroke-linejoin="round" />

  <!-- Feet -->
  <ellipse cx="214" cy="422" rx="24" ry="12" fill="#F59E0B" />
  <ellipse cx="298" cy="422" rx="24" ry="12" fill="#F59E0B" />
</svg>
